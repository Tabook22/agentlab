services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/agent_lab.db
    volumes:
      - lab-data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  lab-data:
