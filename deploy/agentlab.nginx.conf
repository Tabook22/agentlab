location = /agentlab {
    return 308 /agentlab/;
}

location ^~ /agentlab/api/ {
    auth_basic "Agent Lab";
    auth_basic_user_file /etc/nginx/agentlab.htpasswd;
    client_max_body_size 10m;

    set $agentlab_origin $http_origin;
    if ($request_method ~ ^(GET|HEAD|OPTIONS)$) {
        set $agentlab_origin https://$host;
    }
    if ($agentlab_origin != https://$host) {
        return 403;
    }

    proxy_pass http://127.0.0.1:8147/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location ^~ /agentlab/ {
    auth_basic "Agent Lab";
    auth_basic_user_file /etc/nginx/agentlab.htpasswd;

    alias /home/nasser/apps/agentlab/current/frontend/dist/;
    index index.html;
    add_header Cache-Control "private, no-cache";
}
